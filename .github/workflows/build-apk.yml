name: Build APK

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare installable APK
        id: apk
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Source APK: $SRC"
          ls -lh "$SRC"

          # Must be a valid ZIP (APK is a zip)
          file "$SRC"
          unzip -t "$SRC" | tail -n 8

          # Magic bytes PK (zip)
          HEAD=$(xxd -p -l 4 "$SRC")
          echo "Header: $HEAD"
          if [ "$HEAD" != "504b0304" ]; then
            echo "Not a valid APK/ZIP header"
            exit 1
          fi

          VERSION=$(grep versionName app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          NAME="jimi-${VERSION}-debug.apk"
          cp "$SRC" "dist/$NAME"
          cp "$SRC" dist/jimi-debug.apk

          SIZE=$(stat -c%s dist/jimi-debug.apk)
          echo "APK size bytes: $SIZE"
          if [ "$SIZE" -lt 500000 ]; then
            echo "APK too small — broken build"
            exit 1
          fi

          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload APK artifact (single file)
        uses: actions/upload-artifact@v4
        with:
          name: jimi-debug-apk
          path: dist/jimi-debug.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish continuous release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jimi — install this APK
          body: |
            ## Install on Redmi (important)

            1. Download **only** the file named `jimi-debug.apk` (or `jimi-*-debug.apk`).
            2. **Do not** install a `.zip` from Actions. If you got a zip, extract it first — install the `.apk` inside.
            3. Uninstall any old **Jimi** app first.
            4. Open the APK with **Package Installer** / Files.
            5. Settings → Additional settings → Privacy → **Special app access** → Install unknown apps → allow **Files** or **Chrome**.

            If you still see "package invalid" / "parse error":
            - Re-download (file may be incomplete)
            - Confirm file size is **several MB**, not a few KB
            - Confirm the name ends with `.apk`

            Build: `${{ github.sha }}`
          files: |
            dist/jimi-debug.apk
            dist/${{ steps.apk.outputs.apk_name }}
          draft: false
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jimi-debug.apk
            dist/${{ steps.apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
